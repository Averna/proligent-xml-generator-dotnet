---
name: Publish Preview Package

on: # checkov:skip=CKV_GHA_7: workflow_dispatch tag input is intentional for manual publish runs
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release -o out --no-build

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GH_PACKAGES_TOKEN }}
