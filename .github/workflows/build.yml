---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Monday at 06:00 UTC; scheduled runs always use the default branch (main)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run Mega-Linter
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ["10.0.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Proligent.XmlGenerator.sln

      - name: Build
        run: dotnet build Proligent.XmlGenerator.sln -c Release --no-restore

      - name: Test
        run: dotnet test Proligent.XmlGenerator.sln -c Release --no-build --report-trx

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test results (.NET ${{ matrix.dotnet-version }})
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-empty: true

      - name: Generate help docs from XML comments
        shell: pwsh
        run: ./scripts/generate-help.ps1 -Configuration Release

      - name: Upload help docs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: help-docs-${{ matrix.dotnet-version }}
          path: build/help
          if-no-files-found: warn
