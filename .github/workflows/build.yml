---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Monday at 06:00 UTC; scheduled runs always use the default branch (main)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Mega-Linter
        uses: oxsecurity/megalinter@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ["10.0.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Proligent.XmlGenerator.sln

      - name: Build
        run: dotnet build Proligent.XmlGenerator.sln -c Release --no-restore

      - name: Test
        run: dotnet test Proligent.XmlGenerator.sln -c Release --no-build --report-trx

      - name: Generate help docs from XML comments
        shell: pwsh
        run: ./scripts/generate-help.ps1 -Configuration Release

      - name: Upload help docs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: help-docs-${{ matrix.dotnet-version }}
          path: build/help
          if-no-files-found: warn
